<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2530"/>
      <stop offset="1" stop-color="#06080c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#g4)"/>
  <!-- library section drawing -->
  <g stroke="rgba(255,255,255,0.7)" stroke-width="1.5" fill="none">
    <rect x="120" y="300" width="560" height="550"/>
    <line x1="120" y1="450" x2="680" y2="450"/>
    <line x1="120" y1="600" x2="680" y2="600"/>
    <line x1="120" y1="750" x2="680" y2="750"/>
    <!-- book shelves as vertical hatching -->
    <g stroke-width="1" stroke="rgba(255,255,255,0.4)">
      <line x1="160" y1="310" x2="160" y2="440"/>
      <line x1="190" y1="310" x2="190" y2="440"/>
      <line x1="220" y1="310" x2="220" y2="440"/>
      <line x1="250" y1="310" x2="250" y2="440"/>
      <line x1="280" y1="310" x2="280" y2="440"/>
      <line x1="500" y1="460" x2="500" y2="590"/>
      <line x1="530" y1="460" x2="530" y2="590"/>
      <line x1="560" y1="460" x2="560" y2="590"/>
      <line x1="590" y1="460" x2="590" y2="590"/>
      <line x1="620" y1="460" x2="620" y2="590"/>
    </g>
  </g>
  <g fill="rgba(0,51,255,0.85)">
    <rect x="350" y="610" width="100" height="20"/>
    <rect x="400" y="630" width="50" height="60"/>
  </g>
  <text x="60" y="60" fill="rgba(255,255,255,0.5)" font-family="Inter" font-size="14" letter-spacing="4">PROJECT · 04</text>
  <text x="60" y="950" fill="rgba(255,255,255,0.8)" font-family="Fraunces" font-style="italic" font-size="32">Quiet Library</text>
</svg>
