<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a30"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#g1)"/>
  <rect width="800" height="1000" fill="url(#grid1)"/>
  <!-- Architectural massing -->
  <g fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5">
    <rect x="150" y="350" width="500" height="500"/>
    <rect x="150" y="350" width="500" height="120"/>
    <line x1="150" y1="600" x2="650" y2="600"/>
    <line x1="280" y1="470" x2="280" y2="850"/>
    <line x1="400" y1="470" x2="400" y2="850"/>
    <line x1="520" y1="470" x2="520" y2="850"/>
  </g>
  <g fill="rgba(0,51,255,0.9)">
    <rect x="180" y="500" width="80" height="80"/>
    <rect x="540" y="640" width="80" height="80"/>
  </g>
  <text x="60" y="60" fill="rgba(255,255,255,0.5)" font-family="Inter" font-size="14" letter-spacing="4">PROJECT · 01</text>
  <text x="60" y="950" fill="rgba(255,255,255,0.8)" font-family="Fraunces" font-style="italic" font-size="32">House of Echoes</text>
</svg>
